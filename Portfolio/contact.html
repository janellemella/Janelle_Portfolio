
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Janelle Mella</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVIGATION -->
  <header class="site-header">
    <a href="aboutme.html" class="site-logo">Janelle Mella</a>

    <button class="menu-toggle" type="button"
      aria-label="Toggle navigation"
      aria-expanded="false"
      aria-controls="main-nav">☰</button>

    <nav class="main-nav" id="main-nav" aria-label="Main navigation">
      <a href="aboutme.html">About</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html" class="active" aria-current="page">Contact</a>
    </nav>
  </header>

  <main class="inner-page">

    <!-- CONTACT INTRODUCTION -->
    <section class="page-intro contact-intro">
      <p class="eyebrow">GET IN TOUCH</p>

      <h1>Let's chat.</h1>

      <p> Got a scoop? An opportunity? A burning question? Send it my way.</p>

      <div class="contact-links">
        <a href="mailto:janellemella2027@u.northwestern.edu">
          Email me ↗
        </a>

        <a href="https://www.linkedin.com/in/janellemella"
          target="_blank" rel="noopener noreferrer">
          LinkedIn ↗
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Janelle Mella</p>
    <a href="aboutme.html">Back to About ↗</a>
  </footer>

  <script>
    const menuButton = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.main-nav');

    menuButton.addEventListener('click', () => {
      const isOpen = nav.classList.toggle('open');
      menuButton.setAttribute('aria-expanded', isOpen);
      menuButton.textContent = isOpen ? '✕' : '☰';
    });

    nav.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        nav.classList.remove('open');
        menuButton.setAttribute('aria-expanded', 'false');
        menuButton.textContent = '☰';
      });
    });
  </script>

</body>
</html>
